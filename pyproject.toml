[project]
name = "insuretutor"
version = "0.1.0"
description = "Grounded AI tutor over a Hong Kong universal-life insurance brochure"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "httpx>=0.27",
    "python-dotenv>=1.0.1",
    "rank-bm25==0.2.2",
    "opencc-python-reimplemented==0.1.7",
    "tokenizers==0.21.4",
    "numpy==2.3.5",
    "fastembed==0.8.1",
    "onnxruntime==1.24.2",
]

[project.optional-dependencies]
agent = ["openai-agents==0.22.3"]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
