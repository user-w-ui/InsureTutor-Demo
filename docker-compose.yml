services:
  insuretutor:
    build: .
    image: insuretutor:demo
    ports:
      - "127.0.0.1:${PORT:-8000}:8000"
    environment:
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_REASONING_EFFORT: ${LLM_REASONING_EFFORT:-medium}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-32768}
    stop_grace_period: 75s
